<path d="M24 442H366" fill="none" stroke="#D7D7D7" stroke-width="1" stroke-linecap="round"/>
<rect x="24" y="458" width="342" height="56" fill="#F4F4F4" rx="14" stroke="#767676"/>
<use href="#i-plus" x="38" y="474" width="24" height="24" color="#1A1A1A"/>
<text x="74" y="492" font-size="16" fill="#1A1A1A">Write a note</text>
</g>
<rect x="0" y="0" width="390" height="844" fill="none" rx="16" stroke="#A0A0A0"/>
