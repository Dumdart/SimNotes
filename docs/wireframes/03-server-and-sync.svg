<text x="24" y="190" font-size="32" fill="#1A1A1A" font-weight="700">Server settings</text>
<text x="24" y="222" font-size="16" fill="#555555">Connect to your SimNotes server.</text>
<rect x="24" y="252" width="342" height="64" fill="#FFFFFF" rx="12" stroke="#767676"/>
<text x="40" y="275" font-size="12" fill="#555555">Server URL</text>
<text x="40" y="298" font-size="16" fill="#1A1A1A">https://notes.example.com</text>
<rect x="218" y="340" width="148" height="48" fill="#1A1A1A" rx="24.0"/>
<text x="292.0" y="369.0" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Connect</text>
</g>
<rect x="0" y="0" width="390" height="844" fill="none" rx="16" stroke="#A0A0A0"/>
</g>
<text x="32" y="1017" font-size="14" fill="#555555" class="meta">Enter the address of your SimNotes server.</text>
<text x="446" y="132" font-size="16" fill="#1A1A1A" font-weight="700" class="meta">08 / Offline notes</text>
