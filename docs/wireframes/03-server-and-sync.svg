<rect x="0" y="0" width="1282" height="1050" fill="#EEEEEE"/>
<text x="32" y="30" font-size="13" fill="#555555" font-weight="700" class="meta">SIMNOTES / MOBILE WIREFRAMES / 03</text>
<text x="32" y="70" font-size="35" fill="#1A1A1A" font-weight="700">Server and sync</text>
<text x="32" y="99" font-size="16" fill="#555555" class="meta">Connect to a server, keep writing offline, and retry when sync fails</text>
<text x="32" y="132" font-size="16" fill="#1A1A1A" font-weight="700" class="meta">07 / Server settings</text>
<g transform="translate(32 146)" aria-label="Server settings">
<g clip-path="url(#screen)">
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<use href="#i-back" x="24" y="30" width="24" height="24" color="#1A1A1A"/>
<text x="64" y="50" font-size="18" fill="#1A1A1A" font-weight="700">Settings</text>
<path d="M0 72H390" fill="none" stroke="#D7D7D7" stroke-width="1" stroke-linecap="round"/>
<rect x="24" y="100" width="44" height="44" fill="#F4F4F4" rx="12" stroke="#D7D7D7"/>
