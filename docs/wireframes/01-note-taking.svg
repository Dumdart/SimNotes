<rect x="0" y="0" width="1282" height="1050" fill="#EEEEEE"/>
<text x="32" y="30" font-size="13" fill="#555555" font-weight="700" class="meta">SIMNOTES / MOBILE WIREFRAMES / 01</text>
<text x="32" y="70" font-size="35" fill="#1A1A1A" font-weight="700">Taking notes</text>
<text x="32" y="99" font-size="16" fill="#555555" class="meta">Open a notebook, read your notes, and write a new one in place</text>
