<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1282 1050" width="1282" height="1050" role="img" aria-labelledby="title desc">
<title id="title">SimNotes mobile wireframes. Taking notes</title>
<desc id="desc">Open a notebook, read your notes, and write a new one in place</desc>
